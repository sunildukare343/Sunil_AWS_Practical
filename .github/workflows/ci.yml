
name: DevOps Practical CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "057241186497"
  ECR_REPOSITORY: fbc-consent-api-dev
 
jobs:

  # 1. Application Testing
  application-tests:
    name: Application Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devopsdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devopsdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: devopsdb
      DB_USER: postgres
      DB_PASSWORD: postgres123

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r tests/requirements-dev.txt

      - name: Python Syntax Check
        run: python -m compileall -q app tests

      - name: Run Application Tests
        run: pytest -v tests/


  # 2. Terraform Validation
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform -chdir=terraform validate


  # 3. Kubernetes Manifest Validation
  kubernetes-validation:
    name: Kubernetes Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kustomize
      #  uses: imranismail/setup-kustomize@v2
        uses: fluxcd/pkg/actions/kustomize@main

      - name: Build Kubernetes Manifests
        run: kustomize build kubernetes > rendered-manifests.yaml

      - name: Validate Kubernetes Manifests
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary rendered-manifests.yaml


  # 4. Docker Build and ECR Publishing
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - application-tests
      - terraform-validation
      - kubernetes-validation

    # Publish only after successful validation on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t devops-api:${GITHUB_SHA} \
            ./app

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker Image
        run: |
          ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}

          docker tag devops-api:${GITHUB_SHA} \
            ${ECR_URI}:${GITHUB_SHA}

      - name: Push Docker Image to ECR
        run: |
          ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}

          docker push ${ECR_URI}:${GITHUB_SHA}

      - name: Get Immutable Image Digest
        id: digest
        run: |
          ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}

          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"

          echo "Git Commit: $GITHUB_SHA"
          echo "Image: $ECR_URI"
          echo "Digest: $DIGEST"

      - name: Save Release Metadata
        run: |
          mkdir -p release

          {
            echo "Source Commit: $GITHUB_SHA"
            echo "ECR Repository: $ECR_REPOSITORY"
            echo "Image Tag: $GITHUB_SHA"
            echo "Image Digest: $IMAGE_DIGEST"
          } > release/release-metadata.txt

          cat release/release-metadata.txt

      - name: Upload Release Metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release/release-metadata.txt
          retention-days: 30
 