
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-readonly
  namespace: devops-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-readonly
  namespace: devops-app
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-readonly
  namespace: devops-app
subjects:
  - kind: ServiceAccount
    name: devops-readonly
    namespace: devops-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devops-readonly
